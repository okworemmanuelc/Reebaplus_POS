# #608: matches the Flutter 3.44 template. The old 512m metaspace cap made
# R8 fail with OutOfMemoryError: Metaspace once optimized resource shrinking
# was on.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# #608: R8 shrinks resources together with code (Play Console "optimized
# resource shrinking"). Needs AGP 8.12+; default from AGP 9 (#609).
android.r8.optimizedResourceShrinking=true
